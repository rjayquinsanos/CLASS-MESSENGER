<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Chat</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app-container">

    <!-- LOGIN AND SIGN UP SCREEN -->
    <section id="auth-screen" class="auth-card">

      <div class="logo">
        <img src="logo.png" alt="Class Chat Logo" class="app-logo">
        <h1>Class Chat</h1>
        <p>Connect with your classmates</p>
      </div>

      <div class="auth-tabs">
        <button
          id="login-tab"
          class="auth-tab active"
          type="button"
        >
          Log In
        </button>

        <button
          id="signup-tab"
          class="auth-tab"
          type="button"
        >
          Sign Up
        </button>
      </div>

      <form id="auth-form">
        <label for="email">Email Address</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <button
          id="login-button"
          class="primary-button"
          type="submit"
        >
          Log In
        </button>

        <button
          id="signup-button"
          class="secondary-button"
          type="button"
        >
          Create Account
        </button>

        <p id="auth-message" role="status"></p>
      </form>
    </section>

    <!-- CHAT SCREEN -->
    <section id="chat-screen" class="chat-card" hidden>

      <header class="chat-header">
        <div class="chat-brand">
          <img src="logo.png" alt="" class="chat-logo">
          <div>
            <h2>Class Chat</h2>
            <p>Classroom messages</p>
          </div>
        </div>

        <button id="logout-button" type="button">
          Log Out
        </button>
      </header>

      <div
        id="messages"
        class="messages-container"
        aria-live="polite"
      >
        <p class="empty-message">
          Loading messages...
        </p>
      </div>

      <form id="message-form" class="message-form">
        <input
          id="message-input"
          name="message"
          type="text"
          placeholder="Write a message..."
          maxlength="2000"
          autocomplete="off"
          required
        >

        <button id="send-button" type="submit">
          Send
        </button>
      </form>

      <p id="chat-message" role="status"></p>
    </section>

  </main>
</body>
</html>
