<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN AND SIGN-UP SCREEN -->
  <main id="auth-screen" class="auth-container">
    <div class="auth-card">
      <img
        src="logo.png"
        alt="Class Chat CC Logo"
        class="app-logo"
      >

      <h1>Class Chat</h1>
      <p class="subtitle">Connect. Share. Learn together.</p>

      <form id="auth-form">
        <label for="display-name">Name</label>
        <input
          type="text"
          id="display-name"
          placeholder="Enter your name (for sign up)"
          autocomplete="name"
        >

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

        <div class="auth-buttons">
          <button type="submit" id="login-button">
            Log In
          </button>

          <button
            type="submit"
            id="signup-button"
            data-auth-mode="signup"
          >
            Create Account
          </button>
        </div>
      </form>

      <p id="auth-status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <!-- CHAT SCREEN -->
  <main id="chat-screen" class="chat-container" hidden>
    <header class="chat-header">
      <div class="brand">
        <img
          src="logo.png"
          alt="Class Chat Logo"
          class="header-logo"
        >
        <div>
          <h1>Class Chat</h1>
          <p>Welcome, <span id="current-name">Student</span></p>
        </div>
      </div>

      <button type="button" id="logout-button" class="logout-button">
        Log Out
      </button>
    </header>

    <section class="chat-panel">
      <div class="chat-title">
        <h2>Classroom Messages</h2>
        <p>Share updates and talk with your classmates.</p>
      </div>

      <div
        id="message-list"
        class="message-list"
        aria-live="polite"
        aria-label="Chat messages"
      ></div>

      <p id="chat-status" role="status" aria-live="polite"></p>

      <form id="message-form" class="message-form">
        <input
          type="text"
          id="message-input"
          placeholder="Type a message..."
          autocomplete="off"
          maxlength="2000"
          required
        >

        <button type="submit" id="send-button">
          Send
        </button>
      </form>
    </section>
  </main>

  <!-- LOAD SUPABASE BEFORE script.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

</body>
</html>
